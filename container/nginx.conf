# nginx-media: the image's own configuration, and a working starting point.
#
# Mount it to change behaviour without rebuilding.  Mount the *directory*, not
# the file: a single-file bind mount is pinned to the inode, so an editor or
# `sed -i` that replaces the file leaves the container reading the old one.
# A directory mount sees the replacement.
#
#   docker run -d --name media \
#     -p 8080:8080 -p 1935:1935 -p 9000:9000/udp \
#     -v "$PWD/container:/config:ro" \
#     -e NGINX_CONFIG=/config/nginx.conf \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   # edit the file on the host, then
#   docker exec media nginx -s reload
#
# It declares no streams.  A stream is created through the control API, which
# is the point of the runtime graph - the container starts empty and an
# operator or a controller builds the program it wants.
#
# See container/examples/ for scenarios: ingest over SRT or RTMP, recording,
# a relay that publishes onward, and a kitchen sink for testing.

# The master runs as root (it binds the sockets and then setuids); the workers
# drop to www-data.  This is stated rather than left to nginx's compiled
# default of `nobody`, because the image chowns its writable directories to
# www-data and the two have to agree.
user www-data;

# Worker count comes from NGINX_WORKER_PROCESSES.  The entrypoint writes this
# one line into conf.d/workers.conf and leaves the rest of this file alone,
# which is what makes mounting the file above work.
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

# Where HLS output is written and served from.
media_hls /var/lib/nginx/media/hls;

# Accept publishers.  A deployment that only pushes outward can drop these.
media_srt_listen 0.0.0.0:9000;
media_rtmp_listen 0.0.0.0:1935;

http {
    access_log off;

    server {
        listen 8080;

        # The control API: build and inspect the graph here.
        location /media/api/ {
            media_api;
        }

        # The local HLS output.
        location /hls/ {
            alias /var/lib/nginx/media/hls/;
        }
    }
}

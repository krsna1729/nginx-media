# Scenario: recording.
#
# The same program carried to HLS and to disk at once.  All three tap points
# the document defines are here, because the difference between them is the
# point:
#
#   media_record        PROGRAM - after selection, timeline-normalized.  This
#                       is what went to air, and it follows a switch.
#   media_record_raw    RAW - the transport bytes before normalization, kept
#                       for forensics when the program itself looks wrong.
#   media_record_iso    ISO - one named source, before the selector.  Kept per
#                       source so a standby encoder's output is on disk even
#                       while it is not on air.
#
#   docker run -d --name media -p 8080:8080 -p 9000:9000/udp \
#     -v "$PWD/container/examples/06-recording.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   curl -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8080/media/api/v1/streams
#
#   ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#     -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#     -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#     -c:a aac -b:a 128k -f mpegts \
#     "srt://127.0.0.1:9000?streamid=#!::r=live/demo,m=publish,s=encoder-a"
#
#   ls /var/lib/nginx/media/record
#
# Recording I/O runs on worker threads, so a slow disk backs up the recorder
# rather than the program.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

media_hls /var/lib/nginx/media/hls;

media_srt_listen 0.0.0.0:9000;

media_record /var/lib/nginx/media/record;
media_record_raw /var/lib/nginx/media/raw;
media_record_iso live/demo /var/lib/nginx/media/iso;

http {
    access_log off;

    server {
        listen 8080 reuseport;

        location /media/api/ { media_api; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
        location /rec/       { alias /var/lib/nginx/media/record/; }
    }
}

# Scenario: a relay.
#
# Takes a publisher in over SRT and publishes the same program back out over
# SRT, while still producing HLS.  This is the shape to reach for when the
# thing you want is a hop in the middle rather than an origin.
#
#   docker run -d --name relay -p 8080:8080 -p 9000:9000/udp \
#     -v "$PWD/container/examples/04-relay.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   # a sink to publish into, so the output has somewhere to go
#   docker run -d --name sink -p 9100:9100/udp \
#     -v "$PWD/container/examples/05-sink.conf:/etc/nginx/nginx.conf:ro" \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   # create the program and point the relay at the sink
#   curl -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8080/media/api/v1/streams
#
#   ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#     -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#     -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#     -c:a aac -b:a 128k -f mpegts \
#     "srt://127.0.0.1:9000?streamid=#!::r=live/demo,m=publish"
#
# media_srt_output is the one destination that can be declared in
# configuration; RTMP and HLS destinations are created through the API, which
# is where they belong - a destination is runtime state.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

media_hls /var/lib/nginx/media/hls;

media_srt_listen 0.0.0.0:9000;

# Publish the program onward.  The third argument is the SRT stream id the
# receiving end sees; r= is the resource it must already have a stream for.
media_srt_output live/demo 127.0.0.1:9100 "#!::r=live/demo,m=publish,s=relay";

http {
    access_log off;

    server {
        listen 8080 reuseport;

        location /media/api/ { media_api; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
    }
}

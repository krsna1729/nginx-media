# Scenario: a relay.
#
# Takes a publisher in over SRT and publishes the same program back out over
# SRT, while still producing HLS.  This is the shape to reach for when the
# thing you want is a hop in the middle rather than an origin.
#
#   docker network create media-net
#   docker run -d --name relay --network media-net -p 8080:8080 -p 9000:9000/udp \
#     -v "$PWD/container/examples/04-relay.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   # a sink to publish into, so the output has somewhere to go
#   docker run -d --name sink --network media-net -p 9100:9100/udp \
#     -v "$PWD/container/examples/05-sink.conf:/etc/nginx/nginx.conf:ro" \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   # create the program and point the relay at the sink
#   SINK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sink)
#   docker exec sink curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8081/media/api/v1/streams
#   SINK_KEY=$(docker exec sink curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d '{"id":"relay","type":"srt","priority":100}' \
#     http://127.0.0.1:8081/media/api/v1/streams/live/demo/sources \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
#   docker exec relay curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8081/media/api/v1/streams
#   docker exec relay curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d "{\"id\":\"sink\",\"type\":\"srt\",\"host\":\"$SINK_IP\",\"port\":9100,\"streamid\":\"$SINK_KEY\"}" \
#     http://127.0.0.1:8081/media/api/v1/streams/live/demo/destinations
#   KEY=$(docker exec relay curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d '{"id":"encoder","type":"srt","priority":100}' \
#     http://127.0.0.1:8081/media/api/v1/streams/live/demo/sources \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
#
#   ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#     -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#     -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#     -c:a aac -b:a 128k -f mpegts \
#     "srt://127.0.0.1:9000?streamid=$KEY"
#
# Destinations are created through the loopback API using the sink's issued key.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

media_egress_workers srt 1;
media_egress_workers hls_push 1;

media_hls /var/lib/nginx/media/hls;

media_srt_listen 0.0.0.0:9000;


http {
    access_log off;

    server {
        listen 127.0.0.1:8081 reuseport;
        location /media/api/ {
            allow 127.0.0.1;
            deny all;
            media_api;
        }
        location / { deny all; }
    }

    server {
        listen 8080 reuseport;

        location = /media/api { deny all; }
        location ^~ /media/api/ { deny all; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
    }
}

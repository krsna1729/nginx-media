# Scenario: an SRT sink.
#
# Accepts one publisher and does nothing else with it.  Useful as the far end
# of an output test, and as a two-container topology on one host without
# needing a second machine.
#
#   docker run -d --name sink -p 9100:9100/udp \
#     -v "$PWD/container/examples/05-sink.conf:/etc/nginx/nginx.conf:ro" \
#     ghcr.io/krsna1729/nginx-media:latest
#
# It declares no HLS output and no API: everything it does is accept a session
# and keep it, so if a publisher stays connected the transport is working.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 256;
}

media_srt_listen 0.0.0.0:9100;

http {
    access_log off;

    server {
        listen 8080 reuseport;

        # Kept so the session state can be inspected while it is up.
        location /media/api/ { media_api; }
    }
}

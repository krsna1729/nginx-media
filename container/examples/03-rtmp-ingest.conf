# Scenario: RTMP ingest.
#
# Publishers connect over RTMP, which is what most consumer encoders speak.
# Media is carried to HLS and the program is built through the API.
#
#   docker run -d --name media -p 8080:8080 -p 1935:1935 \
#     -v "$PWD/container/examples/03-rtmp-ingest.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   curl -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8080/media/api/v1/streams
#
#   ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#     -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#     -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#     -c:a aac -b:a 128k \
#     -f flv rtmp://127.0.0.1:1935/live/demo
#
# H.265 publishers are accepted too - enhanced RTMP carries the hvc1 fourCC -
# and the program's HLS output follows the codec it is given.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

media_hls /var/lib/nginx/media/hls;

media_rtmp_listen 0.0.0.0:1935;

http {
    access_log off;

    server {
        listen 8080;

        location /media/api/ { media_api; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
    }
}

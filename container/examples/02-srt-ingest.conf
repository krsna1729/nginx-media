# Scenario: SRT ingest.
#
# Publishers connect over SRT and their media is carried to HLS.  The stream
# is still created through the API; the listener only decides how a publisher
# arrives.
#
#   docker run -d --name media -p 8080:8080 -p 9000:9000/udp \
#     -v "$PWD/container/examples/02-srt-ingest.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   curl -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8080/media/api/v1/streams
#
#   ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#     -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#     -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#     -c:a aac -b:a 128k -f mpegts \
#     "srt://127.0.0.1:9000?streamid=#!::r=live/demo,m=publish"
#
# Two publishers naming the same program are two sources, not a replacement:
# the second stands by until the selector promotes it, which is what
# media_failover_* below governs.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

media_hls /var/lib/nginx/media/hls;

# Publishers arrive here.  The port is UDP.
#
# One endpoint per worker: worker i binds the i-th media_srt_listen, so a
# publisher that connects to an entry is accepted by that worker and its media
# is only routed to the program's owner when the owner is a different worker.
# Give the directive once per worker, in worker order, when the worker count is
# fixed - here four workers, four endpoints:
#
#   worker_processes 4;
#   media_srt_listen 0.0.0.0:9000;   # worker 0
#   media_srt_listen 0.0.0.0:9001;   # worker 1
#   media_srt_listen 0.0.0.0:9002;   # worker 2
#   media_srt_listen 0.0.0.0:9003;   # worker 3
#
# then point each encoder at the entry of the worker that owns the program it
# feeds (the graph reports the owner; the choice is `hash % workers`).  A
# single entry is the original shape and is what this example uses: worker 0
# owns the listener and every publisher is routed from there, which is right
# for one worker and for a deployment that has not spread ingest yet.  Fewer
# entries than workers leaves the remaining workers accepting nothing and
# still owning their programs; more entries than workers is a configuration
# error, because a worker binds exactly one endpoint.
media_srt_listen 0.0.0.0:9000;

# Selection policy: how long a source may be silent before it is failed, how
# long it must be good before it is trusted again, and whether the program
# returns to the preferred source on its own.
media_failover_failure_timeout 1500;
media_failover_recovery_timeout 10000;
media_failover_switchback auto;

http {
    access_log off;

    server {
        listen 8080 reuseport;

        location /media/api/ { media_api; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
    }
}

# Scenario: everything, for testing.
#
# SRT and RTMP ingest, HLS, all three recording taps, and the API.  This is
# the configuration to reach for when you want to exercise the whole system at
# once, and it is what a soak or fault run should start from.
#
#   docker run -d --name media -p 8080:8080 -p 1935:1935 -p 9000:9000/udp \
#     -v "$PWD/container/examples/07-full.conf:/etc/nginx/nginx.conf:ro" \
#     -v media:/var/lib/nginx/media \
#     ghcr.io/krsna1729/nginx-media:latest
#
#   docker exec media curl -fsS -X POST -H 'Content-Type: application/json' \
#     -d '{"application":"live","name":"demo"}' \
#     http://127.0.0.1:8081/media/api/v1/streams
#   # two provisioned publishers, so the selector has something to choose between
#   priority=100
#   for enc in a b; do
#     KEY=$(docker exec media curl -fsS -X POST -H 'Content-Type: application/json' \
#       -d "{\"id\":\"encoder-$enc\",\"type\":\"srt\",\"priority\":$priority}" \
#       http://127.0.0.1:8081/media/api/v1/streams/live/demo/sources \
#       | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
#     priority=50
#     ffmpeg -re -f lavfi -i "testsrc2=size=1280x720:rate=25" \
#       -f lavfi -i "sine=frequency=440:sample_rate=48000" -ac 2 \
#       -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p \
#       -c:a aac -b:a 128k -f mpegts \
#       "srt://127.0.0.1:9000?streamid=$KEY" &
#   done
#
# Use docker exec media curl against 127.0.0.1:8081 to add destinations and
# inspect switch counters. The higher-priority source is on air and the other
# is a warm standby; killing the first should fail over without stopping the
# program.

user www-data;
include /etc/nginx/conf.d/workers.conf;

error_log /var/log/nginx/error.log info;
# Where nginx looks for its own pid: the compiled prefix.  Keeping it
# here rather than /run means `nginx -s reload` works without also
# having to name the configuration file.
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 8192;
}

media_egress_workers srt 1;
media_egress_workers hls_push 1;

media_hls /var/lib/nginx/media/hls;

media_srt_listen 0.0.0.0:9000;
media_rtmp_listen 0.0.0.0:1935;

media_record /var/lib/nginx/media/record;
media_record_raw /var/lib/nginx/media/raw;
media_record_iso live/demo /var/lib/nginx/media/iso;

media_failover_failure_timeout 1500;
media_failover_recovery_timeout 10000;
media_failover_switch_keyframe on;
media_failover_switchback auto;

http {
    access_log off;

    server {
        listen 127.0.0.1:8081 reuseport;
        location /media/api/ {
            allow 127.0.0.1;
            deny all;
            media_api;
        }
        location / { deny all; }
    }

    server {
        listen 8080 reuseport;

        location = /media/api { deny all; }
        location ^~ /media/api/ { deny all; }
        location /hls/       { alias /var/lib/nginx/media/hls/; }
        location /rec/       { alias /var/lib/nginx/media/record/; }
    }
}

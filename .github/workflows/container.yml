name: container

# Publishes the image to GHCR.
#
#   push to main     -> latest, sha-<short>
#   push of a v* tag -> <version> only
#   pull request     -> build and smoke, no push
#
# `latest` tracks main HEAD and nothing else.  A release tag publishes its
# version and deliberately does not move `latest`: pulling `latest` gets you
# the newest build of main, pulling a version gets you that release, and
# neither can surprise you by becoming the other.  Pin `sha-<short>` when you
# need a build that does not move at all.
#
# Authentication is GITHUB_TOKEN, which the workflow already has; nothing here
# needs a stored credential.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - '.github/workflows/container.yml'
      - 'src/**'
      - 'config'
      - 'scripts/build-nginx.sh'

# Pull request builds cancel each other; publishes queue.  Cancelling a run
# mid-push leaves a half-written tag, which is worse than waiting a minute for
# the one ahead of it.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f Containerfile -t nginx-media:ci .

      - name: The image serves a request
        run: |
          docker run -d --name media -p 18080:8080 nginx-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/media/api/v1/streams \
                >/dev/null 2>&1
            then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/media/api/v1/streams
          docker logs media 2>&1 | tail -20
          docker rm -f media

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A release: its version, and nothing else.  latest is not
            # touched here on purpose - it belongs to main.
            TAGS="${GITHUB_REF_NAME#v}"
          else
            TAGS="latest sha-$(git rev-parse --short HEAD)"
          fi

          echo "publishing $GITHUB_SHA as: $TAGS"

          for t in $TAGS; do
            docker tag nginx-media:ci "$IMAGE:$t"
          done

          for t in $TAGS; do
            docker push "$IMAGE:$t"
          done

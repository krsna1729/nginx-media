name: container

# Publishes the image to GHCR.
#
#   push to main     -> latest
#   push of a v* tag -> <version>
#   pull request     -> build and smoke, no push
#
# Two kinds of tag and no others.  `latest` tracks main HEAD and is the only
# moving tag; a release publishes its version and deliberately does not touch
# `latest`, so pulling one can never get you the other.
#
# There are no per-commit tags on purpose.  One tag per build is a tag
# explosion that makes the registry harder to read the longer it runs, and
# `latest` plus the version tags are what a deployment actually pulls.  Pin a
# version when you need a build that does not move.
#
# Authentication is GITHUB_TOKEN, which the workflow already has; nothing here
# needs a stored credential.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - '.github/workflows/container.yml'
      - 'src/**'
      - 'config'
      - 'scripts/build-nginx.sh'
  workflow_dispatch:
    inputs:
      prune:
        description: >-
          Space-separated tags to delete from the package. Refuses any version
          that also carries latest or a version tag, so a release cannot be
          removed by accident.
        required: true
        type: string

# Pull request builds cancel each other; publishes queue.  Cancelling a run
# mid-push leaves a half-written tag, which is worse than waiting a minute for
# the one ahead of it.
#
# The event name is in the group because GitHub allows only one *pending* run
# per group, and a new run replaces a pending one regardless of
# cancel-in-progress.  Without it, dispatching a prune while a publish was
# queued cancelled the publish - observed, not theorised.  A prune now waits
# in its own group and cannot displace a publish.
concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          docker build -f Containerfile -t nginx-media:ci \
            --build-arg "IMAGE_VERSION=$VERSION" \
            --build-arg "IMAGE_REVISION=$GITHUB_SHA" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: The image carries its provenance
        run: |
          # A published image with no revision label is an image nobody can
          # trace back, which is the whole reason the labels exist. Fail
          # rather than publish one.
          docker inspect nginx-media:ci --format \
            '{{ range $k, $v := .Config.Labels }}{{ $k }}={{ $v }}{{ "\n" }}{{ end }}'

          for label in revision version created source; do
            value="$(docker inspect nginx-media:ci --format \
              "{{ index .Config.Labels \"org.opencontainers.image.$label\" }}")"

            [ -n "$value" ] && [ "$value" != "unknown" ] \
              || { echo "org.opencontainers.image.$label is missing" >&2
                   exit 1; }
          done

      - name: The image serves a request
        run: |
          docker run -d --name media -p 18080:8080 nginx-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/media/api/v1/streams \
                >/dev/null 2>&1
            then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/media/api/v1/streams
          docker logs media 2>&1 | tail -20
          docker rm -f media

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"

          # Derived from the ref rather than from github.ref_type, and with no
          # default branch: a tag publishes its version, main publishes latest,
          # and anything else stops the run.  The dangerous shape here is a
          # fallback to latest, because that is how a release would silently
          # overwrite the tag that belongs to main.
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG="${GITHUB_REF_NAME#v}"
              ;;
            refs/heads/main)
              TAG="latest"
              ;;
            *)
              echo "nothing to publish for $GITHUB_REF" >&2
              exit 1
              ;;
          esac

          echo "publishing $GITHUB_SHA as $IMAGE:$TAG"

          docker tag nginx-media:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  # Removes tags the policy no longer uses, which is how the strays left by an
  # earlier iteration get cleaned up.  It deletes the version a tag points at,
  # because GHCR's API deletes versions rather than tags - so it refuses any
  # version that carries something else worth keeping.
  prune:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete the named tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PRUNE: ${{ inputs.prune }}
        run: |
          set -eu

          VERSIONS="/users/$OWNER/packages/container/nginx-media/versions"

          for tag in $PRUNE; do
            gh api "$VERSIONS" --paginate \
              --jq '.[] | "\(.id) \(.metadata.container.tags | join(" "))"' \
              > /tmp/versions.txt

            id="$(awk -v t="$tag" \
              '{ for (i = 2; i <= NF; i++) if ($i == t) { print $1; exit } }' \
              /tmp/versions.txt)"

            if [ -z "$id" ]; then
              echo "$tag: not present, nothing to do"
              continue
            fi

            # Refuse if this version carries anything the policy keeps.
            for other in $(awk -v i="$id" \
                '$1 == i { for (j = 2; j <= NF; j++) print $j }' \
                /tmp/versions.txt)
            do
              case "$other" in
                latest|[0-9]*)
                  echo "refusing to delete $tag: version $id also carries" \
                       "$other" >&2
                  exit 1
                  ;;
              esac
            done

            echo "deleting $tag (version $id, also carries:" \
                 "$(awk -v i="$id" \
                     '$1 == i { for (j = 2; j <= NF; j++) printf "%s ", $j }' \
                     /tmp/versions.txt))"
            gh api -X DELETE "$VERSIONS/$id"
          done

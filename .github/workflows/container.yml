name: container

# Publish the image to GHCR on a release tag, and build it on every pull
# request so a broken Containerfile is caught before it is tagged.
#
# Authentication is GITHUB_TOKEN, which the workflow already has; nothing here
# needs a stored credential.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - '.github/workflows/container.yml'
      - 'src/**'
      - 'config'
      - 'scripts/build-nginx.sh'

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f Containerfile -t nginx-media:ci .

      - name: The image serves a request
        run: |
          docker run -d --name media -p 18080:8080 nginx-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/media/api/v1/streams \
                >/dev/null 2>&1
            then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/media/api/v1/streams
          docker logs media 2>&1 | tail -20
          docker rm -f media

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${GITHUB_REF_NAME#v}"
          docker tag nginx-media:ci "$IMAGE:$TAG"
          docker tag nginx-media:ci "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

name: container

# Publishes the image to GHCR.
#
#   push to main    -> latest, main, sha-<short>   the newest build of main
#   push of a v* tag -> <version>, latest          a release
#   pull request    -> build and smoke only, no push
#
# `latest` follows the newest publish of either kind: it tracks main HEAD
# between releases and moves to a release when one is tagged.  That is a
# deliberate choice, not an accident - it means `latest` is unreleased code
# most of the time.  Pin `sha-<short>` or a version tag when you need a build
# that does not move.
#
# Authentication is GITHUB_TOKEN, which the workflow already has; nothing here
# needs a stored credential.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - '.github/workflows/container.yml'
      - 'src/**'
      - 'config'
      - 'scripts/build-nginx.sh'

# Publishes share one group so two of them cannot race on `latest` - a branch
# build and a tag build landing together could otherwise leave the older
# commit holding the tag.  They queue rather than cancel, because cancelling a
# run mid-push is worse than waiting.  Pull request builds are per-ref and do
# cancel each other.
concurrency:
  group: >-
    container-${{
      (github.ref_type == 'tag' || github.ref_name == 'main')
        && 'publish' || github.ref
    }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f Containerfile -t nginx-media:ci .

      - name: The image serves a request
        run: |
          docker run -d --name media -p 18080:8080 nginx-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/media/api/v1/streams \
                >/dev/null 2>&1
            then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/media/api/v1/streams
          docker logs media 2>&1 | tail -20
          docker rm -f media

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${GITHUB_REF_NAME#v} latest"
          else
            TAGS="latest main sha-$(git rev-parse --short HEAD)"
          fi

          echo "publishing $GITHUB_SHA as: $TAGS"

          for t in $TAGS; do
            docker tag nginx-media:ci "$IMAGE:$t"
          done

          for t in $TAGS; do
            docker push "$IMAGE:$t"
          done

name: container

# Publishes the image to GHCR.
#
#   push to main     -> latest
#   push of a v* tag -> <version>
#   pull request     -> build and smoke, no push
#
# Two kinds of tag and no others.  `latest` tracks main HEAD and is the only
# moving tag; a release publishes its version and deliberately does not touch
# `latest`, so pulling one can never get you the other.
#
# There are no per-commit tags on purpose.  One tag per build is a tag
# explosion that makes the registry harder to read the longer it runs, and
# `latest` plus the version tags are what a deployment actually pulls.  Pin a
# version when you need a build that does not move.
#
# Authentication is GITHUB_TOKEN, which the workflow already has; nothing here
# needs a stored credential.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Containerfile'
      - 'container/**'
      - '.github/workflows/container.yml'
      - 'src/**'
      - 'config'
      - 'scripts/build-nginx.sh'

# Pull request builds cancel each other; publishes queue.  Cancelling a run
# mid-push leaves a half-written tag, which is worse than waiting a minute for
# the one ahead of it.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          docker build -f Containerfile -t nginx-media:ci \
            --build-arg "IMAGE_VERSION=$VERSION" \
            --build-arg "IMAGE_REVISION=$GITHUB_SHA" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .

      - name: The image carries its provenance
        run: |
          # A published image with no revision label is an image nobody can
          # trace back, which is the whole reason the labels exist. Fail
          # rather than publish one.
          docker inspect nginx-media:ci --format \
            '{{ range $k, $v := .Config.Labels }}{{ $k }}={{ $v }}{{ "\n" }}{{ end }}'

          for label in revision version created source; do
            value="$(docker inspect nginx-media:ci --format \
              "{{ index .Config.Labels \"org.opencontainers.image.$label\" }}")"

            [ -n "$value" ] && [ "$value" != "unknown" ] \
              || { echo "org.opencontainers.image.$label is missing" >&2
                   exit 1; }
          done

      - name: The image serves a request
        run: |
          docker run -d --name media -p 18080:8080 nginx-media:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/media/api/v1/streams \
                >/dev/null 2>&1
            then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/media/api/v1/streams
          docker logs media 2>&1 | tail -20
          docker rm -f media

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A release publishes its version and nothing else.  latest is not
            # touched here on purpose - it belongs to main.
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi

          echo "publishing $GITHUB_SHA as $IMAGE:$TAG"

          docker tag nginx-media:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

name: nightly

# Every night: the sanitizer and fuzz passes that are too slow for a pull
# request, plus the soak test.  The unit binaries are built with ASan+UBSan by
# default (tests/unit/Makefile), so "make unit" is already the sanitizer run;
# this job adds ThreadSanitizer on the concurrent runtimes and the parser
# fuzzers, then soaks the whole thing.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  # One night, one run: a second trigger waits rather than doubling a soak.
  group: nightly
  cancel-in-progress: false

jobs:
  sanitizers-and-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Take ownership of the apt archive dir
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpcre2-dev zlib1g-dev libssl-dev \
            ffmpeg libsrt-openssl-dev

      - name: Cache the pinned nginx source
        uses: actions/cache@v4
        with:
          path: .build/nginx-1.30.5
          key: nginx-${{ runner.os }}-1.30.5

      - name: Build nginx with the module
        run: make nginx

      - name: Unit tests under ASan and UBSan
        run: make unit

      - name: Parser fuzzers (extended run)
        run: |
          NGX_MEDIA_FUZZ_SCALE=25 ./tests/unit/build/test_fuzz

      - name: ThreadSanitizer on the concurrent runtimes
        run: make tsan

      - name: Soak - churn publishers, destinations and reloads
        run: make soak

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: .build/**/logs/error.log
          if-no-files-found: ignore

  # All seven workloads, 30 s rungs, published to the gh-pages history.
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      tier: nightly
      timeout-minutes: 240
    permissions:
      contents: read
      actions: write

  publish:
    needs: bench
    # published even when a rung failed: a failure is part of the history
    if: always() && needs.bench.result != 'cancelled'
    uses: ./.github/workflows/bench-publish.yml
    with:
      tier: nightly
    permissions:
      contents: write

name: release

# Tagged releases.  Builds the pinned nginx with the module, runs the full
# suite one more time on the exact commit being released, then publishes the
# module sources, the built binary and checksums.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize release builds across tags. GitHub retains at most one pending
  # run per group, so a newer queued release can replace an older pending one.
  group: release-${{ github.ref_type == 'tag' && 'tags' || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the main full-suite check for tag releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list \
            --workflow master.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 100 \
            --json databaseId,status \
            --jq '[.[] | select(.status == "completed")][0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No completed master run for $GITHUB_SHA on main; wait for the main suite and rerun this release." >&2
            exit 1
          fi

          conclusion="$(gh run view "$run_id" --json jobs \
            --jq '[.jobs[] | select(.name == "full-suite")][0].conclusion // "missing"')"
          if [ "$conclusion" != success ]; then
            echo "master full-suite run $run_id concluded $conclusion" >&2
            exit 1
          fi

      - name: Take ownership of the apt archive dir
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpcre2-dev zlib1g-dev libssl-dev \
            ffmpeg libsrt-openssl-dev iproute2

      - name: Cache the pinned nginx source
        uses: actions/cache@v4
        with:
          path: .build/nginx-1.30.5
          key: nginx-${{ runner.os }}-1.30.5

      - name: Build nginx with the module
        run: make nginx

      # The released dynamic binary links a library built from source at the
      # pin in scripts/srt-pins.sh, not the runner's package: a release is a
      # claim about a version, and the version is in the release notes.
      - name: Build the pinned SRT library and an nginx against it
        run: |
          make srt-pinned
          echo "NGINX_BIN=$PWD/.build/nginx-haivision/install/sbin/nginx" \
            >> "$GITHUB_ENV"
          scripts/srt-pins.sh --print | sed 's/^/   /'

      - name: Unit tests
        run: make unit

      - name: Full integration suite
        run: |
          make test-integration
          make netns

      - name: Backend qualification (both transport backends)
        run: make srt-qualify

      - name: Verify the release does not link libsrt in a udp-only build
        run: |
          MEDIA_SRT_BACKEND=udp make nginx
          if ldd .build/nginx-install/sbin/nginx | grep -q srt; then
              echo "a udp-only build must not link libsrt" >&2
              exit 1
          fi
          make nginx

      # The second artifact: one file, no library dependencies.  Both are
      # built from this tag, so "the dynamic one" and "the static one" are the
      # same source with different dependency answers.
      - name: Build the statically linked artifact
        run: scripts/build-static.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="nginx-media-$VERSION"
          mkdir -p "dist/$STAGE"

          # module sources and build glue
          tar -cf - \
              --exclude='.build' --exclude='.git' --exclude='dist' \
              config src tests scripts Makefile README.md \
              | tar -xf - -C "dist/$STAGE"

          # the built servers, for anyone who wants the exact artifact:
          # one dynamic against the pinned libsrt, one static with no
          # library dependencies at all
          tar -czf "dist/nginx-$VERSION-linux-x86_64.tar.gz" \
              -C .build/nginx-haivision/install sbin/nginx
          tar -czf "dist/nginx-$VERSION-linux-x86_64-static.tar.gz" \
              -C .build/static nginx

          tar -czf "dist/$STAGE.tar.gz" -C dist "$STAGE"
          rm -rf "dist/$STAGE"

          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

          ls -l dist

      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
              echo "# ${GITHUB_REF_NAME:-dev}"
              echo
              if [ -n "$PREV" ]; then
                  echo "Changes since $PREV:"
                  echo
                  git log --no-merges --pretty='- %s' "$PREV"..HEAD
              else
                  echo "Initial release."
              fi
              echo
              echo "## Libraries"
              echo
              echo "Both binaries are built from this tag.  The dynamic one links"
              echo "libsrt built from source at the commit below; the static one"
              echo "links libsrt, OpenSSL, PCRE2 and zlib into the file itself, so"
              echo "a fix in any of them is a new artifact rather than a system"
              echo "update."
              echo
              scripts/srt-pins.sh --release-notes
              echo "- nginx ${NGINX_VERSION:-1.30.5}"
              echo "- OpenSSL $(openssl version 2>/dev/null || echo 'unknown') for the dynamic build"
              echo
              echo "The static artifact is built in an Alpine/musl container with"
              echo "Alpine's static OpenSSL; the dynamic one uses this runner's"
              echo "OpenSSL, which is why its version is not pinned."
          } > dist/CHANGELOG.md

          cat dist/CHANGELOG.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/CHANGELOG.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Upload artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

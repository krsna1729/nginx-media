name: master

# Merge to main: the full integration suite, including the multi-worker
# routing, the soak test and the fault injection run, then the branch
# benchmark tier, whose results are published to the gh-pages history.  CI
# covers the fast paths; this is the one that has to be green before anything
# is tagged.  (It used to trigger on "master", a branch this repository does
# not have, so it never ran.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: master-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Take ownership of the apt archive dir
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpcre2-dev zlib1g-dev libssl-dev \
            ffmpeg libsrt-openssl-dev

      - name: Cache the pinned nginx source
        uses: actions/cache@v4
        with:
          path: .build/nginx-1.30.5
          key: nginx-${{ runner.os }}-1.30.5

      - name: Build nginx with the module
        run: make nginx

      - name: Unit tests
        run: make unit

      - name: Full integration suite
        run: |
          make srt-ingest
          make srt-ingest-nginx
          make ts-fixture
          make source-switch
          make api-switch
          make api-graph
          make failover
          make hls
          make hls-push
          make hls-pull
          make hls-ingest
          make hls-profile
          make hls-push-conformance
          make ffmpeg-interop
          make file-source
          make rtmp
          make rtmp-hevc
          make rtmps
          make srt-output
          make srt-output-mux
          make srt-lane-isolation
          make srt-crypto
          make multi-worker
          make soak
          make fault

      - name: Backend qualification (both transport backends)
        run: make srt-qualify

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: master-logs
          path: .build/**/logs/error.log
          if-no-files-found: ignore

  bench:
    needs: full-suite
    uses: ./.github/workflows/bench.yml
    with:
      tier: branch
      # the three configurations run as parallel jobs; publish merges them
      configs: '["srt","rtmp","rtmp-srt"]'
      timeout-minutes: 60
    permissions:
      contents: read
      actions: write

  publish:
    needs: bench
    # published even when a rung failed: a failure is part of the history
    if: always() && needs.bench.result != 'cancelled'
    uses: ./.github/workflows/bench-publish.yml
    with:
      tier: branch
    permissions:
      contents: write

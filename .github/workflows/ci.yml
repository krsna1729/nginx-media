name: ci

# Three environments, because the libraries the media path depends on differ
# enough between them to matter:
#
#   ubuntu    the runner itself: Ubuntu 24.04, libsrt 1.5.3, ffmpeg 6.1.1
#   debian    the image's own base: Debian trixie, libsrt 1.5.4, ffmpeg 7.1.5
#   sid       the canary: Debian sid, libsrt 1.5.7, ffmpeg 9
#
# The stream id bug that made this suite fail on every CI run was exactly an
# environment difference - ffmpeg 6.1.1 passes the stream id percent-encoded
# where later ffmpeg decodes it first - so one environment is not coverage.
#
# The container jobs run the same `make` targets as the runner does, through
# the Containerfile's test stage, so a failure there reproduces locally with
# `make test-in-container` instead of needing a runner to investigate.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      # actions/cache restores with read and saves with write.
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Take ownership of the apt archive dir
        # actions/cache restores as the runner user, and the archive dir is
        # root-owned.  Without this the restore fails and every run pays for
        # a cold apt.
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          # The package list lives in the Install step below, so any edit to
          # a workflow rotates the key.  A stale .deb shares its versioned
          # filename with the index and is ignored, never installed.
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpcre2-dev zlib1g-dev libssl-dev \
            ffmpeg libsrt-openssl-dev iproute2

      - name: Cache the pinned nginx source
        uses: actions/cache@v4
        with:
          path: .build/nginx-1.30.5
          key: nginx-${{ runner.os }}-1.30.5

      - name: Build nginx with the module
        run: make nginx

      - name: Unit tests
        run: make unit

      - name: Concurrency suites under ThreadSanitizer
        run: make -C tests/unit tsan

      - name: Integration - ingest and demux
        run: |
          make srt-ingest
          make srt-ingest-nginx
          make ts-fixture

      - name: Integration - selection and outputs
        run: |
          make source-switch
          make api-switch
          make api-graph
          make failover
          make hls
          make hls-push
          make hls-pull
          make hls-ingest
          make hls-profile
          make file-source
          make rtmp
          make srt-output

      - name: Integration - transport security
        run: |
          make srt-crypto
          make rtmp-hevc
          make rtmps

      - name: Integration - churn, soak and fault injection
        run: |
          make churn
          make multi-worker
          make soak
          make fault

      # Namespaces need privileges a container should not be given, so this
      # is the one target that only runs here.
      - name: Integration - namespace topology and netem
        run: make netns

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .build/**/logs/error.log
          if-no-files-found: ignore

  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      # the BuildKit GHA cache backend reads and writes through the token.
      actions: write

    env:
      # Layer caching for the test image.  Reads hit on every run; writes
      # happen only on main, so a pull request can never poison the cache
      # the next run builds on.
      DOCKER_CACHE_ARGS: ${{ github.ref == 'refs/heads/main' && '--cache-from type=gha --cache-to type=gha,mode=max' || '--cache-from type=gha' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: make test-image

      - name: The integration suite, in the shipped image's environment
        run: make test-in-container

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-debian
          path: .build/**/logs/error.log
          if-no-files-found: ignore

  # The newest libraries, so a change upstream is seen here rather than in a
  # deployment.  Not allowed to fail the run: sid moves, and a red run that
  # turns out to be sid's churn teaches nothing.
  sid:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    permissions:
      contents: read
      actions: write

    env:
      DOCKER_CACHE_ARGS: ${{ github.ref == 'refs/heads/main' && '--cache-from type=gha --cache-to type=gha,mode=max' || '--cache-from type=gha' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the test image on sid
        run: make test-image TEST_IMAGE=nginx-media:test-sid DOCKER="docker" BASE=debian:sid

      - name: The integration suite on sid
        run: make test-in-container TEST_IMAGE=nginx-media:test-sid

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-sid
          path: .build/**/logs/error.log
          if-no-files-found: ignore

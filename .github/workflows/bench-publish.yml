name: bench-publish

# Publishes a benchmark run's results to the gh-pages history
# (data/<tier>.jsonl and tests/bench/history/index.html), and opens one
# deduplicated issue for every detected comparable regression.
#
# Separate from bench.yml because publishing needs contents: write and issue
# creation needs issues: write. Pull requests run bench.yml only; publishing is
# called after main, nightly and weekly benchmarks so it collects their
# artifacts. The global publication queue also serializes regression issue
# list/create; immutable input replay still protects history after a push race.

on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
      configs:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: nginx-media-benchmark-publication
      queue: max
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Resolve visible source artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TIER: ${{ inputs.tier }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
          CONFIGURATION_JOBS: ${{ inputs.configs }}
        run: |
          for poll in $(seq 1 12); do
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > source-pages.tmp; then
              mv source-pages.tmp source-pages.json
            fi
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$SOURCE_ATTEMPT/jobs" > source-jobs.tmp; then
              mv source-jobs.tmp source-jobs.json
            fi
            if python3 scripts/select-bench-artifacts.py source-pages.json \
              --current-jobs source-jobs.json --tier "$SOURCE_TIER" \
              --attempt "$SOURCE_ATTEMPT" --configurations "$CONFIGURATION_JOBS" \
              --out source-artifacts.json; then
              break
            fi
            sleep 10
          done
          python3 scripts/select-bench-artifacts.py source-pages.json \
            --current-jobs source-jobs.json --tier "$SOURCE_TIER" \
            --attempt "$SOURCE_ATTEMPT" --configurations "$CONFIGURATION_JOBS" \
            --out source-artifacts.json --github-output "$GITHUB_OUTPUT" || status=$?
          if [ "${status:-0}" != 0 ]; then
            echo "::warning::Source evidence is incomplete or unavailable; preserving that verdict."
          fi

      - name: Collect every job's results
        if: ${{ steps.artifacts.outputs.artifact_ids != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.artifacts.outputs.artifact_ids }}
          path: results
          merge-multiple: true

      - name: Collect same-runner trend samples
        if: ${{ steps.artifacts.outputs.trend_artifact_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.artifacts.outputs.trend_artifact_id }}
          path: trend
          merge-multiple: true
      - name: Summarize
        id: summary
        run: |
          python3 tests/bench/bench_history.py summarize results \
            --tier "${{ inputs.tier }}" --out summary.json \
            --expected-configs '${{ inputs.configs }}' \
            --source-artifacts source-artifacts.json

      - name: Prepare gh-pages history
        id: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add pages origin/gh-pages
            git -C pages checkout -B gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf --quiet .
          fi

      - name: Detect benchmark regressions
        id: findings
        run: |
          regression_summary=summary.json
          history_file="pages/data/${{ inputs.tier }}.jsonl"
          if [ -s trend/current.json ]; then
            regression_summary=trend/current.json
            if [ -s trend/samples.jsonl ]; then
              : > trend/history.jsonl
              if [ -f "$history_file" ]; then cat "$history_file" >> trend/history.jsonl; fi
              cat trend/samples.jsonl >> trend/history.jsonl
              history_file=trend/history.jsonl
            fi
          fi
          python3 tests/bench/bench_history.py regressions "$regression_summary" \
            --history "$history_file" --out regressions.json

      - name: Open issues for benchmark regressions
        id: issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier }}
          SITE_URL: https://krsna1729.github.io/nginx-media/
        run: |
          set -euo pipefail
          while IFS= read -r finding; do
            title="$(jq -r --arg tier "$TIER" \
              '"[bench regression] \($tier) \(.config)/\(.mix) at \(.destinations) destinations"' \
              <<<"$finding")"
            existing="$(gh issue list --state open --limit 100 \
              --search "\"$title\" in:title" --json number,title |
              jq -r --arg title "$title" \
                '[.[] | select(.title == $title)][0].number // empty')"
            if [ -n "$existing" ]; then
              echo "Benchmark regression issue already open: #$existing"
              continue
            fi
            body="$(jq -r --arg tier "$TIER" --arg url "$SITE_URL" \
              --arg sha "$GITHUB_SHA" \
              --arg commit "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '
                "Automated benchmark regression: sender CPU per delivered Gbit/s is more than 25% above the median of at least three complete, passing runs with the same runner fingerprint.\n\n" +
                "- Tier: `\($tier)`\n" +
                "- Workload: `\(.config)/\(.mix)`\n" +
                "- Rung: `\(.destinations)` destinations\n" +
                "- Current: \(.current) %/Gbit/s\n" +
                "- Comparable-run median: \(.baseline_median) %/Gbit/s (`\(.baseline_count)` runs)\n" +
                "- Regression factor: \(.factor)x\n" +
                "- Runner: \(.runner.cpu_model // "unknown"); kernel \(.runner.kernel // "unknown"); transport \(.runner.transport // "unknown")\n" +
                "- Commit: [\($sha)](\($commit))\n" +
                "- Workflow run: [view run](\($run))\n\n" +
                "[View published capacity history](\($url))"
              ' <<<"$finding")"
            gh issue create --title "$title" --body "$body"
          done < <(jq -c '.[]' regressions.json)

      - name: Append to the gh-pages history
        if: always() && steps.pages.outcome == 'success' && steps.summary.outcome == 'success'
        run: |
          sample_args=()
          if [ -s trend/samples.jsonl ]; then
            sample_args=(--samples trend/samples.jsonl)
          fi
          # Reapply immutable records to the newest tree instead of rebasing
          # competing JSONL appends (which can conflict or discard attempts).
          for attempt in $(seq 1 12); do
            python3 tests/bench/bench_history.py publish summary.json --pages pages "${sample_args[@]}"
            git -C pages add -A
            if git -C pages diff --cached --quiet; then exit 0; fi
            git -C pages commit -m "bench: ${{ inputs.tier }} $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            git -C pages push origin HEAD:gh-pages && exit 0
            sleep $(( attempt * 2 ))
            git -C pages fetch origin gh-pages
            git -C pages checkout --detach origin/gh-pages
          done
          echo "::error::History publication retries exhausted; source artifacts remain attached to this run."
          exit 1

      - name: Report regression issue creation failure
        if: steps.issues.outcome == 'failure'
        run: |
          echo "::error title=benchmark regression issue::Issue automation failed; consult the history publication step for its independent outcome."
          exit 1

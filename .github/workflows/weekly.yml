name: weekly

# Weekly: the long runs.  Extended soak and fault injection against the real
# transports, plus the backend qualification that builds the both-backend
# binary and puts one scenario through each implementation.

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Take ownership of the apt archive dir
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libpcre2-dev zlib1g-dev libssl-dev \
            ffmpeg libsrt-openssl-dev

      - name: Cache the pinned nginx source
        uses: actions/cache@v4
        with:
          path: .build/nginx-1.30.5
          key: nginx-${{ runner.os }}-1.30.5

      - name: Build nginx with the module
        run: make nginx

      - name: Unit tests
        run: make unit

      - name: Extended soak
        run: |
          SOAK_CYCLES=40 make soak

      - name: Fault injection
        run: make fault

      - name: Single-host impairment (network namespaces and netem)
        run: make netns

      - name: Transport backend qualification (both backends)
        run: make srt-qualify

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-logs
          path: .build/**/logs/error.log
          if-no-files-found: ignore

  # Long rungs, SRT sender concurrency (fixed 1/2/4 vs adaptive), HLS
  # preparation off, and the transport library comparison (libsrt vs
  # robotweax/srt).  Each group is its own runner so the week's run fits the
  # job limit; the publish job merges them into one record.
  bench:
    uses: ./.github/workflows/bench.yml
    with:
      tier: weekly
      timeout-minutes: 350
      configs: >-
        ["all", "srt-senders-1 srt-senders-2",
         "srt-senders-4 srt-senders-adaptive srt-no-hls", "srt-robotweax"]
    permissions:
      contents: read
      actions: write

  publish:
    needs: bench
    # published even when a rung failed: a failure is part of the history
    if: always() && needs.bench.result != 'cancelled'
    uses: ./.github/workflows/bench-publish.yml
    with:
      tier: weekly
    permissions:
      contents: write

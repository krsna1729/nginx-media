# The workloads the capacity-quality ladder knows, in the order `all` runs them.
# One list, read by both the harness (ingest_egress_fanout.sh) and the CI
# driver (scripts/bench-ci.sh): the driver's expected-run manifest and what the
# harness executes can differ only if one of them stops reading this file.
#
#   name : primary protocol : SRT share (%) [: HLS push share (%)]
pure-srt:srt:0
pure-rtmp:rtmp:0
pure-hls:hls:0
pure-hls-push:hls-push:0
rtmp-95-srt-5:rtmp:5
hls-push-95-srt-5:hls-push:5
rtmp-50-hls-push-45-srt-5:rtmp-hls-push:5:45
# contention: SRT at half the destinations, with RTMP and HLS push beside it,
# which the published mixes never exercise (their SRT share is 5%)
srt-50-rtmp-25-hls-push-25:rtmp-hls-push:50:25
# the same contention shape with a quarter of the destinations on SRT: between
# the published 5% share (where HLS push works) and the 50% share (where it
# does not), to find where it stops
srt-25-rtmp-25-hls-push-50:rtmp-hls-push:25:50
